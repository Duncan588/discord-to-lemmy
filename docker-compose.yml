x-logging: &lg
  driver: json-file
  options: {max-size: "20m", max-file: "3"}
services:
  proxy:
    image: nginx:1-alpine
    ports: ["${LEMMY_PORT:-8536}:8536"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [lemmy, lemmy-ui]
    restart: unless-stopped
    logging: *lg
  lemmy:
    image: dessalines/lemmy:0.19.20
    hostname: lemmy
    environment: ["RUST_LOG=warn"]
    volumes: ["./lemmy.hjson:/config/config.hjson:ro"]
    depends_on: [postgres, pictrs]
    restart: unless-stopped
    logging: *lg
  lemmy-ui:
    image: dessalines/lemmy-ui:0.19.20
    environment:
      - LEMMY_UI_LEMMY_INTERNAL_HOST=lemmy:8536
      - LEMMY_UI_LEMMY_EXTERNAL_HOST=${LEMMY_HOST}
      - LEMMY_UI_HTTPS=false
    depends_on: [lemmy]
    restart: unless-stopped
    init: true
    logging: *lg
  pictrs:
    image: asonix/pictrs:0.5.24
    hostname: pictrs
    environment: ["PICTRS__API_KEY=${PICTRS_API_KEY}", "RUST_LOG=warn"]
    user: "991:991"
    volumes: ["./volumes/pictrs:/mnt"]
    restart: unless-stopped
    logging: *lg
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    environment: ["POSTGRES_USER=lemmy", "POSTGRES_PASSWORD=${PG_PW}", "POSTGRES_DB=lemmy"]
    command: postgres -c shared_buffers=512MB -c work_mem=32MB -c maintenance_work_mem=256MB -c synchronous_commit=off
    volumes: ["./volumes/postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
    logging: *lg
